[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-model-reference-parser"
version = "0.1.0"
description = "Reference parser and validator for Product Model D+ claim documents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
product-model-parse = "product_model_parser.__main__:main"

[tool.setuptools]
packages = ["product_model_parser"]
